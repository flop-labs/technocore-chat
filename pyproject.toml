[project]
name = "technocore-chat"
version = "0.10.0"
description = "HTTP-native chat and notes for AI agents — over plain GETs or MCP"
license = "Apache-2.0"
# One Python, everywhere: `.python-version` pins what uv provisions locally and in CI, and
# docker/Dockerfile pins the same 3.12 by digest. A long-lived service whose whole job is
# parsing hostile path segments should not run on a version nobody tested it on.
requires-python = ">=3.12"
dependencies = [
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.2",
    # Signature *verification* only (src/didkey.py) — libsodium is ~2x OpenSSL per verify
    # (bench/ed25519_backends.py), and provably the same verdicts (tests/unit).
    "pynacl==1.6.2",
    # Every stored record passes through this: ~4.7x stdlib on the read path and ~13.7x on
    # the append, byte-identical output for the shapes store.py writes (so no migration),
    # and it rejects the NaN/Infinity literals stdlib accepts. app.py keeps stdlib json for
    # the three published documents, which use indent=1 and orjson only does indent 2.
    "orjson==3.12.0",
    # Still required: scripts/sign.py generates keys with it, and the docs examples
    # exercised by tests/http/test_docs.py use its X25519 and AES-GCM.
    "cryptography==50.0.0",
]

# The image installs from uv.lock, so these are the only pins in the repo — the Dockerfile
# no longer carries a second copy that can drift out of step with this file.
[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pytest>=9.1.1",
    "httpx2>=2.10.0",
    "ruff>=0.16.1",
    "ty>=0.0.71",
    # The store's lifecycle rules only conflict in *sequences*; tests/test_store_stateful.py
    # generates the orderings.
    "hypothesis>=6.165.10",
    # In `dev` rather than its own group since tests/test_contract.py — the generative half
    # of the input doctrine (docs/design.md §3.5) — runs inside pytest, so the ordinary
    # `uv sync --frozen` has to be enough to run the suite. Pinned exactly, not `>=` like
    # the rest: the test's whole claim is that a failure is a change in this service and
    # not in the generator that found it. The out-of-process CLI run in .github/workflows
    # /ci.yml uses this same pin.
    "schemathesis==4.25.0",
]

# Same reasoning, and it never runs on a pull request — see
# .github/workflows/mutation.yml and tests/mutation_scope.py.
mutation = [
    "mutmut==3.7.0",
]

[tool.ruff]
line-length = 100
# target-version is inferred from requires-python — one place to change it.

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]  # Line length is the formatter's job.

[tool.ruff.lint.isort]
# app.py imports store and didkey as plain top-level modules — they ship flat into the
# image and are imported by path, never installed. Telling ruff they are first-party
# keeps the import blocks sorted the way the code is actually laid out.
known-first-party = ["app", "didkey", "store"]

[tool.ty.environment]
# Same reason: `import store` resolves only with src/ on the path. mcp/src is the
# separately-published MCP wrapper — its own package, checked here so it cannot rot.
extra-paths = ["./src", "./mcp/src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# The single source of path bootstrap for the suite — src for import app/store/didkey,
# tests for _client — so no test file needs its own sys.path.insert.
pythonpath = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src", "mcp/src"]

[tool.coverage.report]
# Combined statement + branch coverage. A branch-aware floor keeps a PR from improving the
# headline merely by executing happy-path lines while every refusal/recovery edge stays dark.
fail_under = 96
precision = 2
show_missing = true
skip_covered = true

# Mutation testing, on a schedule rather than per pull request. Which functions are worth
# the machine time, and why, is in tests/mutation_scope.py; this is only its plumbing.
[tool.mutmut]
source_paths = ["src"]
# humans.html is the only other thing in src/ and it is not Python. config.py is out on
# purpose: tests/mutation_scope.py declares no mutants of interest there (its floors and
# parsing are exercised directly by the boot tests), while the limiter it feeds is in.
only_mutate = ["src/app.py", "src/store.py", "src/didkey.py", "src/limit.py"]
# mutmut runs the suite in a copy of the project, so anything the tests read from the repo
# root has to come along: the cross-checked version lives in three files, the Dockerfile is
# asserted against, and app.py reads SKILL.md at import.
also_copy = ["SKILL.md", "docker", "mcp"]
# test_mcp.py is excluded, not forgotten: nothing in scope is reachable through the wrapper
# that the HTTP tests do not already reach, and it is time paid once per mutant.
# test_app.py was split into tests/http/ and tests/unit/; every shard selects the same
# suite the monolith did, and test_mcp.py stays excluded for the reason above.
pytest_add_cli_args_test_selection = [
    "tests/http",
    "tests/unit",
    "tests/test_store_stateful.py",
]

# Not an installable package: src/ is copied into the image and imported by path.
# Without this, uv tries to build a wheel and fails.
[tool.uv]
package = false
required-version = ">=0.9"
