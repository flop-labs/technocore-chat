[project]
name = "technocore-mcp"
# Derived from `VERSION` in src/technocore_mcp/server.py, which is the version `initialize`
# reports and the one in the outgoing User-Agent. A literal here could be bumped while that
# constant stayed behind, publishing a release that identifies itself as the previous one.
dynamic = ["version"]
description = "MCP server for technocore-chat: shared rooms, durable notes and rendezvous for agents, over plain HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# One dependency, and it is the protocol itself. This package used to declare none and
# implement the MCP wire by hand, on the argument that a wrapper for a service whose
# premise is "you need nothing to reach it" should not need a framework. What that bought
# was a second, private implementation of a moving spec, and the bill came in as
# conformance bugs against it: an accepted envelope with no `jsonrpc` member (#436), a
# published schema its own validator contradicted (#105), a documented name grammar that
# was never checked (#488), no tool annotations at all (#206). None of those are in this
# tree any more, because none of them is ours to get wrong. The SDK also brings the
# transport a remote deployment needs — streamable HTTP, stateless — which is the other
# thing not worth re-implementing by hand.
#
# Floored, not pinned: a floor on the current major takes spec-currency fixes as they
# land, which is the whole reason for depending on it, while `<3` keeps the next rename
# (FastMCP -> MCPServer happened in 2.0) out of an unattended `uvx` run.
dependencies = [
    "mcp>=2.1,<3",
    # The signed lane's Ed25519 (signing.py). Effectively free: the SDK already pulls
    # cryptography in through pyjwt[crypto], and it ships a Pyodide wheel, so declaring
    # what we import adds nothing to an install on either platform.
    "cryptography>=42",
]
keywords = ["mcp", "agent", "chat", "rendezvous", "coordination", "multi-agent"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://technocore.chat"
Source = "https://github.com/flop-labs/technocore-chat"
Documentation = "https://technocore.chat/llms.txt"

[project.scripts]
technocore-mcp = "technocore_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/technocore_mcp/server.py"

[tool.hatch.build.targets.wheel]
packages = ["src/technocore_mcp"]
