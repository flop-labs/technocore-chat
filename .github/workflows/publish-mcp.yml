name: Publish MCP wrapper

# Tag-driven, and released in lockstep with the service: one version number spans the
# image, the wrapper and the skill, so `v0.6.0` and `mcp-v0.6.0` are cut together and name
# the same release. The cost is accepted deliberately — a service-only change still
# republishes an unchanged wrapper, which is the price of never having to work out which
# wrapper version a given service version was current for. `pyproject.toml` is the source;
# a test asserts every other declaration equals it.
#
# ONE-TIME SETUP, both of them outside this file:
#   1. PyPI trusted publishing — https://pypi.org/manage/project/technocore-mcp/settings/publishing/
#      (or the pending-publisher form if the name is unclaimed). Owner `flop-labs`,
#      repository `technocore-chat`, workflow `publish-mcp.yml`, environment `pypi`.
#      No token is stored anywhere: the job authenticates with its OIDC identity.
#   2. Nothing for the MCP registry. The `io.github.flop-labs/*` namespace is proven by the
#      same OIDC identity, and package ownership by the `mcp-name:` line in mcp/README.md.
on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

# Publishing is not cancellable: PyPI versions are immutable, so cancelling after the
# PyPI step and restarting would strand the registry half. Duplicate runs for the same
# tag queue behind the active one instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "PyPI + MCP registry"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      # Both publishes are OIDC: PyPI trusted publishing, and the registry's namespace proof.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Four places claim this version and a mismatch publishes something other than what it
      # says. server.json carries it twice — once for the server, once for the package —
      # server.py's VERSION is what `initialize` and the User-Agent report, and the root
      # pyproject is the number all of them follow. The wheel derives its own from that
      # constant, so mcp/pyproject.toml has no literal to check.
      - name: Check the tag matches every version that claims it
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          code=$(grep -m1 '^VERSION = ' mcp/src/technocore_mcp/server.py | cut -d'"' -f2)
          srv=$(python -c 'import json;d=json.load(open("mcp/server.json"));print(d["version"])')
          pkg=$(python -c 'import json;d=json.load(open("mcp/server.json"));print(d["packages"][0]["version"])')
          proj=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag server.py=$code server.json=$srv package=$pkg pyproject=$proj"
          [ "$tag" = "$code" ] && [ "$tag" = "$srv" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$proj" ] ||
            { echo "::error::version mismatch between the tag, server.py's VERSION, mcp/server.json and pyproject.toml"; exit 1; }

      # The registry matches this against server.json's `name` to prove we own the PyPI
      # package. It fails there, after the release is public — cheaper to fail here.
      - name: Check the PyPI ownership marker is present
        run: |
          name=$(python -c 'import json;print(json.load(open("mcp/server.json"))["name"])')
          grep -q "mcp-name: $name" mcp/README.md ||
            { echo "::error::mcp/README.md is missing the 'mcp-name: $name' marker"; exit 1; }

      - name: Test
        run: uv sync --frozen && uv run python -m pytest tests/test_mcp.py -q

      - name: Build
        run: uv build --project mcp

      - name: Publish to PyPI
        run: uv publish mcp/dist/*

      # Wait for the file to be servable before telling the registry to go look at it: the
      # registry fetches the PyPI JSON API to validate ownership, and a publish that has not
      # propagated reads as a package that does not exist.
      - name: Wait for PyPI to serve the new version
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          for _ in $(seq 30); do
            if curl -fsS "https://pypi.org/pypi/technocore-mcp/$tag/json" >/dev/null; then
              echo "visible on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "::error::technocore-mcp $tag not visible on PyPI after 5 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          # This job holds an OIDC publishing credential. Pin and verify the executable
          # instead of running bytes from a mutable `latest` URL.
          version="v1.8.1"
          sha256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          tar xzf "${archive}" mcp-publisher
          rm "${archive}"
          ./mcp-publisher --version

      - name: Publish to the MCP registry
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
