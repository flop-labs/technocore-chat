name: Public issue and PR triage

on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply labels and issue closures
        type: boolean
        default: false

permissions: {}

concurrency:
  group: public-triage
  cancel-in-progress: false

jobs:
  triage:
    if: github.repository_owner == 'flop-labs' && (github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: flop-labs/.github/public-triage@5d3ccdd570bdb39011c93e2ea56da708533bca42
        with:
          apply: ${{ github.event_name == 'schedule' || inputs.apply }}
          jev-key: ${{ secrets.TYPESAFE_API_KEY }}
