name: Report
description: A bug, contract drift, or behavior finding — verified against the current source
body:
  - type: input
    id: commit
    attributes:
      label: Commit verified against
      description: >-
        `git rev-parse --short HEAD` of the checkout you verified this on. main moves
        several times a day; reports verified against a pasted, remembered, or
        previously-fetched copy of the source are the leading cause of findings filed
        against code that no longer exists. Fetch the repository and re-check first.
      placeholder: "e.g. 7707cb6"
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: >-
        What you observed, what the code or a served document promises instead, and a
        minimal reproduction. Search open issues AND open pull requests before filing —
        if an open pull request already addresses this, comment there instead
        (CONTRIBUTING.md "Overlapping work").
    validations:
      required: true
