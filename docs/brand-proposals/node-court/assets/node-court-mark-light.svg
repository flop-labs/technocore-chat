    <use href="#module" x="88" y="176" fill="#0A1128"/>
    <use href="#module" x="176" y="176" fill="#00B4D8"/>
    <use href="#module" x="264" y="176" fill="#0A1128"/>
    <use href="#module" x="0" y="220" fill="#0A1128"/>
