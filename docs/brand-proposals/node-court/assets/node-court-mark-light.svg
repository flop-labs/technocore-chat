<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Technocore NODE COURT mark light</title>
  <desc id="desc">A D4-symmetric modular Technocore mark.</desc>
